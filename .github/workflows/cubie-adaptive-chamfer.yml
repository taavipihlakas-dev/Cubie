name: Cubie C0.5 validated adaptive physical chamfer rebuild
on:
  push:
    branches: [codex/cubie-geometry-rebuild-20261101]
    paths: [.github/workflows/cubie-adaptive-chamfer.yml, tools/cubie_adaptive_chamfer.py]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Chamfer with per-region watertight and connected-body checks
        run: |
          python -m pip install --quiet numpy trimesh networkx manifold3d==3.5.4
          python -u tools/cubie_adaptive_chamfer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubie-adaptive-verified-chamfer
          path: |
            cubie_adaptive_valid_chamfer.stl
            cubie_chamfer_accept_reject.npz
          if-no-files-found: warn

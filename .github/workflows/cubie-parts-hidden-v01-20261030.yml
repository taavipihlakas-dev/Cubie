name: Publish Cubie A7A visibility-only candidate v01
on:
  push:
    branches:
      - codex/cubie-parts-hidden-v01-20261030
    paths:
      - .github/workflows/cubie-parts-hidden-v01-20261030.yml
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch precisely three visibility/UI occurrences
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path("baseline/Cubie_A7A_05mm_faasid_osaline.html")
          dst=Path("Cubie_A7A_05mm_faasid_osaline_v01_osad_peidus.html")
          expected="661666f196459ec15edce3b1fe39cd552ce4a25dd7212a606bf7cf77d3bdbe91"
          candidate="056db2997d1056c3b68d7ad8beb7d9872dd47be79d18439f637749787c9d6501"
          data=src.read_bytes()
          assert len(data)==5527796 and hashlib.sha256(data).hexdigest()==expected
          assert not dst.exists()
          patches=[
          (b"const initiallyVisible=true;",b"const initiallyVisible=entry.name.startsWith('Konstruktsioon');"),
          (b"document.getElementById('reset').onclick=()=>{orthographic=true;az=0;el=0;distance=fit;panX=0;panY=0;draw();};",b"document.getElementById('reset').onclick=()=>{orthographic=true;az=0;el=0;distance=fit;panX=0;panY=0;for(const g of groups)g.visible=g.isPanel;for(const row of document.querySelectorAll('#items .item')){const g=groups[Number(row.dataset.index)];row.classList.toggle('off',!g.visible);}draw();};"),
          (b"1 mm v\xc3\xb5rk \xc2\xb7 eraldi osad (kl\xc3\xb5ps peidab)",b"1 mm v\xc3\xb5rk \xc2\xb7 eraldi osad (kl\xc3\xb5ps n\xc3\xa4itab/peidab)")
          ]
          patched=data
          for old,new in patches:
              assert patched.count(old)==1
              patched=patched.replace(old,new,1)
          restored=patched
          for old,new in reversed(patches):
              assert restored.count(new)==1
              restored=restored.replace(new,old,1)
          assert restored==data
          assert len(patched)==5528023 and hashlib.sha256(patched).hexdigest()==candidate
          dst.write_bytes(patched)
          print("VERIFIED candidate SHA-256:",candidate)
          print("VERIFIED original unchanged:",expected)
          PY
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "1"
          git add Cubie_A7A_05mm_faasid_osaline_v01_osad_peidus.html
          test "$(git diff --cached --name-only)" = "Cubie_A7A_05mm_faasid_osaline_v01_osad_peidus.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Cubie locked-baseline-derived candidate with parts hidden initially and on reset"
          git push origin HEAD:refs/heads/codex/cubie-parts-hidden-v01-20261030
      - name: Publish unchanged candidate as prerelease asset and verify download
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
          GH_REPO: \${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="cubie-a7a-v01-osad-peidus-20261030"
          NAME="Cubie_A7A_05mm_faasid_osaline_v01_osad_peidus.html"
          EXPECTED="056db2997d1056c3b68d7ad8beb7d9872dd47be79d18439f637749787c9d6501"
          test "$(sha256sum "$NAME" | cut -d' ' -f1)" = "$EXPECTED"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "FAIL: release already exists, refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" "$NAME" \
            --repo "$GH_REPO" --target "$(git rev-parse HEAD)" \
            --title "Cubie A7A - v01, separate parts hidden on start and reset" \
            --notes "PRE-RELEASE candidate. Only initial part visibility, reset visibility, and matching UI label differ from the locked HTML baseline. Main branch and original baseline unchanged. SHA-256: $EXPECTED." \
            --prerelease
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download "$TAG" --repo "$GH_REPO" \
            --pattern "$NAME" --dir "$RUNNER_TEMP/verify"
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/verify/$NAME" | sha256sum --check --strict
          echo "VERIFIED RELEASE ASSET: $NAME"
          echo "SHA-256: $EXPECTED"
          echo "LINK: https://github.com/$GH_REPO/releases/download/$TAG/$NAME"

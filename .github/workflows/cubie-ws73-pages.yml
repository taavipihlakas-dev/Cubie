name: Deploy Cubie WS73 verified work candidate
on:
  push:
    branches: [codex/cubie-wave73-c05-surface-20261101]
    paths: [.github/workflows/cubie-ws73-pages.yml]
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: cubie-a7a-preview
      url: https://taavipihlakas-dev.github.io/Cubie/
    steps:
      - uses: actions/checkout@v4
      - name: Get checked Waveshare mesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ws73
          gh run download 41334172286 --repo taavipihlakas-dev/Cubie --name waveshare-73-test-geometry --dir /tmp/ws73
      - name: Build validated HTML candidate
        run: |
          python -m pip install --quiet numpy trimesh
          python tools/cubie_build_ws73_candidate.py /tmp/ws73/waveshare_73_test.stl
          git fetch origin codex/cubie-pages-preview-20261030 --depth=1
          git show FETCH_HEAD:Cubie_A7A_05mm_faasid_osaline_v01_osad_peidus.html > _site/v01.html
          test "$(sha256sum _site/v01.html | cut -d' ' -f1)" = "056db2997d1056c3b68d7ad8beb7d9872dd47be79d18439f637749787c9d6501"
      - name: Save candidate without changing baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cubie_A7A_v02_WS73_tookandidaat.html
          git commit -m "Save verified new Cubie working candidate v02 with WS73 clearance"
          git push origin HEAD:codex/cubie-wave73-c05-surface-20261101
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
      - name: Verify deployed v02 bytes
        run: |
          EXPECTED=c96ec534c9019d8845475e5c8884d75010e62794937973190fbe148c4b8be6c1
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 15 https://taavipihlakas-dev.github.io/Cubie/v02.html -o /tmp/live_cubie.html &&
               test "$(sha256sum /tmp/live_cubie.html | cut -d' ' -f1)" = "$EXPECTED"; then
              echo "VERIFIED LIVE CUBIE WS73 CANDIDATE"
              exit 0
            fi
            sleep 3
          done
          exit 1
